<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTARCTIC - Admin Panel</title>
    <link rel="stylesheet" href="/admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Fallback styles in case CSS doesn't load */
        .hidden { display: none !important; }
        .login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
    </style>
</head>
<body>
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1 class="logo-text">A N T A R C T I C</h1>
                <p class="subtitle">License Management System v1.0</p>
            </div>
            <div class="login-form">
                <label for="admin-key">Admin Key</label>
                <input type="password" id="admin-key" placeholder="Enter admin key" autocomplete="off">
                <button id="login-btn" class="btn-primary">LOGIN</button>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="admin-panel hidden">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <h1 class="brand">A N T A R C T I C</h1>
                    <span class="tagline">by bachi</span>
                </div>
                <div class="nav-actions">
                    <button id="refresh-btn" class="btn-icon" title="Refresh Data">
                        <span class="icon">↻</span>
                    </button>
                    <button id="logout-btn" class="btn-logout">LOGOUT</button>
                </div>
            </div>
        </nav>

        <div class="main-container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon total">
                        <span>📊</span>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="total-licenses">0</div>
                        <div class="stat-label">TOTAL LICENSES</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon active">
                        <span>✓</span>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="active-licenses">0</div>
                        <div class="stat-label">ACTIVE</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon expired">
                        <span>⏱</span>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="expired-licenses">0</div>
                        <div class="stat-label">EXPIRED</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon banned">
                        <span>🚫</span>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="banned-licenses">0</div>
                        <div class="stat-label">BANNED</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2>Create New License</h2>
                </div>
                <div class="card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="license-type">LICENSE TYPE</label>
                            <select id="license-type" class="form-control">
                                <option value="week">1 Week</option>
                                <option value="month" selected>1 Month</option>
                                <option value="3months">3 Months</option>
                                <option value="6months">6 Months</option>
                                <option value="year">1 Year</option>
                                <option value="lifetime">Lifetime</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="license-count">COUNT</label>
                            <input type="number" id="license-count" class="form-control" min="1" max="100" value="1">
                        </div>
                        <div class="form-group">
                            <label for="license-notes">NOTES (OPTIONAL)</label>
                            <input type="text" id="license-notes" class="form-control" placeholder="e.g., customer name, order # etc.">
                        </div>
                    </div>
                    <button id="generate-btn" class="btn-generate">GENERATE LICENSE(S)</button>
                </div>

                <div id="generated-licenses" class="generated-section hidden">
                    <div class="generated-header">
                        <h3>Generated Licenses</h3>
                        <button id="export-btn" class="btn-export">EXPORT TO TXT</button>
                    </div>
                    <div id="generated-list" class="generated-list"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2>All Licenses</h2>
                    <div class="search-box">
                        <input type="text" id="search-input" class="search-input" placeholder="Search by key, type, or notes...">
                    </div>
                </div>
                <div class="card">
                    <div class="table-container">
                        <table class="licenses-table">
                            <thead>
                                <tr>
                                    <th>LICENSE KEY</th>
                                    <th>TYPE</th>
                                    <th>STATUS</th>
                                    <th>CREATED</th>
                                    <th>EXPIRES</th>
                                    <th>LAST USED</th>
                                    <th>USAGE</th>
                                    <th>NOTES</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="licenses-table-body">
                                <tr>
                                    <td colspan="9" class="loading">Loading licenses...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <span class="notification-icon"></span>
            <span class="notification-message"></span>
        </div>
    </div>

    <script src="/admin-script.js"></script>
</body>
</html>
